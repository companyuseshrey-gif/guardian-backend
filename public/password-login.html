<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardian – Password Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --surface2:#263446;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --dim:     #64748b;
      --accent:  #3b82f6;
      --accent-h:#2563eb;
      --success: #22c55e;
      --error:   #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .logo { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .logo-icon {
      width:36px; height:36px; border-radius:10px;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .logo-text { font-size:20px; font-weight:700; }
    .subtitle { font-size:13px; color:var(--dim); margin-bottom:32px; }
    label {
      display:block;
      font-size:12px;
      font-weight:600;
      color:var(--muted);
      margin-bottom:6px;
      letter-spacing:.04em;
    }
    input[type="text"], input[type="password"] {
      width:100%;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:8px;
      padding:11px 14px;
      color:var(--text);
      font-size:14px;
      outline:none;
      margin-bottom:16px;
      transition:border-color .15s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color:var(--accent);
    }
    input::placeholder { color:var(--dim); }
    .submit-btn {
      width:100%; padding:13px;
      background:var(--accent); color:#fff;
      border:none; border-radius:10px;
      font-size:15px; font-weight:600;
      cursor:pointer; transition:background .15s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .submit-btn:hover:not(:disabled) { background:var(--accent-h); }
    .submit-btn:disabled { background:var(--border); color:var(--dim); cursor:not-allowed; }
    .error-msg {
      margin-top:14px;
      padding:10px 14px;
      background:rgba(239,68,68,.1);
      border:1px solid rgba(239,68,68,.3);
      border-radius:8px;
      font-size:13px;
      color:#fca5a5;
      display:none;
    }
    .spin {
      display:inline-block; width:14px; height:14px;
      border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff; border-radius:50%;
      animation:s .65s linear infinite; flex-shrink:0;
    }
    @keyframes s { to { transform:rotate(360deg); } }
    .footer {
      margin-top:24px;
      padding-top:20px;
      border-top:1px solid var(--border);
      text-align:center;
    }
    .footer a {
      font-size:12px;
      color:var(--dim);
      text-decoration:none;
    }
    .footer a:hover { color:var(--muted); }
  </style>
</head>
<body>

<!-- Redirect authenticated users straight to the dashboard -->
<script>
(function(){
  fetch('/api/session',{credentials:'include'})
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d.authenticated)window.location.href='/devices';})
    .catch(function(){});
})();
</script>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <span class="logo-text">Guardian</span>
  </div>
  <p class="subtitle">Sign in with your password</p>

  <form id="login-form" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required />

    <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
    <div class="error-msg" id="error-msg"></div>
  </form>

  <div class="footer">
    <a href="/">← Back to wallet login</a>
  </div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  var btn = document.getElementById("submit-btn");
  var errEl = document.getElementById("error-msg");
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Signing in…';
  errEl.style.display = "none";

  try {
    var resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ username: username, password: password })
    });
    var data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || "Invalid username or password.");
    }
    btn.innerHTML = "✓ Authenticated — loading dashboard…";
    setTimeout(function() { window.location.href = "/devices"; }, 600);
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed. Please try again.";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.innerHTML = "Sign In";
  }
});
</script>
</body>
</html>
